# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
name: bastion
description: Bazzite + Hyprland image for bastion, an always-on gaming, dev and media desktop.

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

stages:
  # Builds bastion-xwayland-compat; see files/scripts/build-xwayland-compat.sh
  - name: xwayland-compat
    from: registry.fedoraproject.org/fedora:44
    modules:
      - type: script
        scripts:
          - build-xwayland-compat.sh
  # Builds wiremix; see files/scripts/build-wiremix.sh
  - name: wiremix
    from: registry.fedoraproject.org/fedora:44
    modules:
      - type: script
        scripts:
          - build-wiremix.sh
  # Builds tgt; see files/scripts/build-tgt.sh
  - name: tgt
    from: registry.fedoraproject.org/fedora:44
    modules:
      - type: script
        scripts:
          - build-tgt.sh

modules:
  - from-file: modules/dev-languages.yml
  - from-file: modules/desktop.yml
  - from-file: modules/remote.yml
  - from-file: modules/gaming.yml
  - from-file: modules/containers.yml
  - from-file: modules/cli-tools.yml
  - from-file: modules/ai-agents.yml
  - from-file: modules/apps.yml
  - from-file: modules/chat.yml
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
