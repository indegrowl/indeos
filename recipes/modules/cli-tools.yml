# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Terminal, shell and everyday CLI tools.
modules:
  - type: dnf
    repos:
      copr:
        - atim/lazygit
        - atim/starship
        - lihaohong/yazi
        - varlad/zellij
        - sdegler/hyprland # cliphist
    install:
      packages:
        - kitty # Hyprland's default config binds Super+Q to kitty
        - neovim
        - tmux
        - zellij
        - git
        - lazygit
        - starship
        - gh
        - btop
        - glow
        - pass
        - gnupg2
        - zoxide
        - fzf
        - ripgrep
        - tree
        - yazi
        - wl-clipboard
        - cliphist

  # Clones and applies github.com/indegrowl/dotfiles into ~/.local/share/chezmoi
  # on first login (or at boot, with lingering). Updates are manual.
  - type: chezmoi
    repository: https://github.com/indegrowl/dotfiles.git
    all-users: true
    disable-update: true
    file-conflict-policy: skip
