# bastion: SSH is only reachable over Tailscale (firewall), and only Tailscale
# addresses may use passwords. Root login is off everywhere.
# Named 10- so it loads before Fedora's 50-redhat.conf: sshd keeps the first
# value it sees for each option.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

Match Address 100.64.0.0/10,fd7a:115c:a1e0::/48
    PasswordAuthentication yes
